<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0" />
  
  <text x="640" y="52" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="30" fill="#1D1D1F" text-anchor="middle" font-weight="bold">中台如何下发任务</text>
  
  <path fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1" d="M68,80 H422 A8,8 0 0 1 430,88 V652 A8,8 0 0 1 422,660 H68 A8,8 0 0 1 60,652 V88 A8,8 0 0 1 68,80 Z" />
  <path fill="#1565C0" d="M68,80 H422 A8,8 0 0 1 430,88 V116 A8,8 0 0 1 422,124 H68 A8,8 0 0 1 60,116 V88 A8,8 0 0 1 68,80 Z" />
  <rect x="60" y="104" width="370" height="20" fill="#1565C0" />
  <text x="245" y="108" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">A. Task Queue / Workflow</text>
  <path fill="#2E7D32" fill-opacity="0.15" d="M92,138 H148 A12,12 0 0 1 160,150 V150 A12,12 0 0 1 148,162 H92 A12,12 0 0 1 80,150 V150 A12,12 0 0 1 92,138 Z" />
  <text x="120" y="155" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#2E7D32" text-anchor="middle" font-weight="bold">最现实</text>
  <text x="80" y="190" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#1D1D1F" font-weight="bold">核心模式：</text>
  <text x="80" y="218" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• JSON Task Payload</text>
  <text x="80" y="244" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• Agent 拉取 → 执行 → 反馈</text>
  <text x="80" y="270" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 类似 Jira / Temporal / BPMN</text>
  
  <path fill="#1D1D1F" d="M86,300 H404 A6,6 0 0 1 410,306 V494 A6,6 0 0 1 404,500 H86 A6,6 0 0 1 80,494 V306 A6,6 0 0 1 86,300 Z" />
  <text x="95" y="325" font-family="monospace" font-size="12" fill="#9CA3AF">// Task Payload Example</text>
  <text x="95" y="348" font-family="monospace" font-size="12" fill="#FFFFFF">{</text>
  <text x="95" y="370" font-family="monospace" font-size="12" fill="#FFFFFF">  "task_id": "t-2026-001",</text>
  <text x="95" y="392" font-family="monospace" font-size="12" fill="#FFFFFF">  "type": "invoice_review",</text>
  <text x="95" y="414" font-family="monospace" font-size="12" fill="#FFFFFF">  "assigned_to": "finance_agent",</text>
  <text x="95" y="436" font-family="monospace" font-size="12" fill="#FFFFFF">  "priority": "high",</text>
  <text x="95" y="458" font-family="monospace" font-size="12" fill="#FFFFFF">  "escalation": "human_approval"</text>
  <text x="95" y="480" font-family="monospace" font-size="12" fill="#FFFFFF">}</text>
  <text x="80" y="530" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280">优势：可观测、可重放、可审计</text>
  
  <path fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1" d="M463,80 H817 A8,8 0 0 1 825,88 V652 A8,8 0 0 1 817,660 H463 A8,8 0 0 1 455,652 V88 A8,8 0 0 1 463,80 Z" />
  <path fill="#FF6F00" d="M463,80 H817 A8,8 0 0 1 825,88 V116 A8,8 0 0 1 817,124 H463 A8,8 0 0 1 455,116 V88 A8,8 0 0 1 463,80 Z" />
  <rect x="455" y="104" width="370" height="20" fill="#FF6F00" />
  <text x="640" y="108" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">B. A2A Protocol</text>
  <path fill="#FF6F00" fill-opacity="0.15" d="M487,138 H543 A12,12 0 0 1 555,150 V150 A12,12 0 0 1 543,162 H487 A12,12 0 0 1 475,150 V150 A12,12 0 0 1 487,138 Z" />
  <text x="515" y="155" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#FF6F00" text-anchor="middle" font-weight="bold">未来方向</text>
  <text x="475" y="190" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#1D1D1F" font-weight="bold">交互流程：</text>
  <text x="475" y="225" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">1. Discover — 发现能力</text>
  <text x="475" y="258" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">2. Negotiate — 协商条件</text>
  <text x="475" y="291" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">3. Handoff — 移交任务</text>
  <text x="475" y="324" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">4. Return — 返回结果</text>
  <text x="475" y="370" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#1D1D1F" font-weight="bold">代表协议：</text>
  <text x="475" y="400" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• Google A2A (Agent-to-Agent)</text>
  <text x="475" y="428" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• HTTP + SSE + JSON-RPC 2.0</text>
  <text x="475" y="480" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280">挑战：标准未统一，生态碎片化</text>
  
  <path fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1" d="M858,80 H1212 A8,8 0 0 1 1220,88 V652 A8,8 0 0 1 1212,660 H858 A8,8 0 0 1 850,652 V88 A8,8 0 0 1 858,80 Z" />
  <path fill="#2E7D32" d="M858,80 H1212 A8,8 0 0 1 1220,88 V116 A8,8 0 0 1 1212,124 H858 A8,8 0 0 1 850,116 V88 A8,8 0 0 1 858,80 Z" />
  <rect x="850" y="104" width="370" height="20" fill="#2E7D32" />
  <text x="1035" y="108" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">C. 现实选择</text>
  <text x="870" y="160" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#1D1D1F" font-weight="bold">推荐组合：</text>
  <path fill="#2E7D32" fill-opacity="0.08" stroke="#2E7D32" stroke-width="1.5" d="M876,180 H1174 A6,6 0 0 1 1180,186 V224 A6,6 0 0 1 1174,230 H876 A6,6 0 0 1 870,224 V186 A6,6 0 0 1 876,180 Z" />
  <text x="1025" y="211" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#2E7D32" text-anchor="middle" font-weight="bold">Workflow + API + Queue</text>
  <text x="870" y="270" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#1D1D1F" font-weight="bold">核心原则：</text>
  <text x="870" y="305" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 不是自由 Agent 对话</text>
  <text x="870" y="335" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 中台统一调度</text>
  <text x="870" y="365" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 结构化任务描述</text>
  <text x="870" y="395" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 可观测可审计</text>
  <path fill="#C62828" fill-opacity="0.08" stroke="#C62828" stroke-width="1" d="M876,440 H1174 A6,6 0 0 1 1180,446 V474 A6,6 0 0 1 1174,480 H876 A6,6 0 0 1 870,474 V446 A6,6 0 0 1 876,440 Z" />
  <text x="1025" y="465" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#C62828" text-anchor="middle">避免：Agent 之间自由聊天式协作</text>
  
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#9CA3AF">07</text>
</svg>