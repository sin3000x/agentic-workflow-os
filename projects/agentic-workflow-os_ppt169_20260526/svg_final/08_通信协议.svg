  <path fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1" d="M463,90 H817 A8,8 0 0 1 825,98 V542 A8,8 0 0 1 817,550 H463 A8,8 0 0 1 455,542 V98 A8,8 0 0 1 463,90 Z" />
