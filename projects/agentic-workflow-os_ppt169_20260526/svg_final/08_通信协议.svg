  <path fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1" d="M858,90 H1212 A8,8 0 0 1 1220,98 V542 A8,8 0 0 1 1212,550 H858 A8,8 0 0 1 850,542 V98 A8,8 0 0 1 858,90 Z" />
