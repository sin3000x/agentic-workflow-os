<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Decorative background elements -->
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <!-- Top-right decorative circle -->
  <circle cx="1100" cy="120" r="200" fill="#1565C0" fill-opacity="0.04"/>
  <circle cx="1150" cy="80" r="120" fill="#1E88E5" fill-opacity="0.05"/>
  <!-- Bottom-left decorative -->
  <circle cx="180" cy="600" r="160" fill="#1565C0" fill-opacity="0.03"/>
  <!-- Left accent bar -->
  <rect x="60" y="280" width="6" height="160" rx="3" fill="#1565C0"/>
  <!-- Main title -->
  <text x="100" y="340" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="54" font-weight="700" fill="#1D1D1F">Agentic Workflow OS</text>
  <!-- Subtitle -->
  <text x="100" y="395" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#6B7280">中台 Agent 编排架构 — 从数据分析到业务流程革新</text>
  <!-- Divider line -->
  <line x1="100" y1="430" x2="500" y2="430" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- Info line -->
  <text x="100" y="470" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#9CA3AF">研究总结  |  2026.05</text>
  <!-- Bottom accent stripe -->
  <rect x="0" y="700" width="1280" height="20" fill="#1565C0"/>
  <!-- Small icon decorative cluster top-right -->
  <use data-icon="tabler-outline/robot" x="950" y="300" width="40" height="40" fill="#1565C0" stroke-width="2" fill-opacity="0.15"/>
  <use data-icon="tabler-outline/network" x="1020" y="350" width="36" height="36" fill="#1E88E5" stroke-width="2" fill-opacity="0.12"/>
  <use data-icon="tabler-outline/users" x="980" y="410" width="34" height="34" fill="#1565C0" stroke-width="2" fill-opacity="0.10"/>
</svg>