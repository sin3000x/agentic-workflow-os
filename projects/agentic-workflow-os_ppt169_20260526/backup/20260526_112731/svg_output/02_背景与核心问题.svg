<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Header -->
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <text x="60" y="55" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="28" font-weight="700" fill="#1D1D1F">我们的构想与核心问题</text>
  <!-- Takeaway box -->
  <rect x="60" y="72" width="1160" height="40" rx="6" fill="#1565C0" fill-opacity="0.06"/>
  <text x="80" y="98" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#1565C0">核心构想：中台Agent通过数据分析发现任务 → 下发给员工Agent → 自主完成/升级人工 → 反馈结果闭环</text>
  <!-- Left: Architecture diagram -->
  <g id="arch-diagram">
    <rect x="60" y="135" width="420" height="530" rx="10" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Supervisor -->
    <rect x="160" y="170" width="220" height="60" rx="8" fill="#1565C0"/>
    <use data-icon="tabler-outline/robot" x="175" y="185" width="30" height="30" fill="#FFFFFF" stroke-width="2"/>
    <text x="215" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">中台 Agent</text>
    <text x="215" y="218" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.8">数据分析 / 异常监控 / 任务编排</text>
    <!-- Arrows down -->
    <line x1="200" y1="230" x2="140" y2="290" stroke="#1565C0" stroke-width="1.5"/>
    <line x1="270" y1="230" x2="270" y2="290" stroke="#1565C0" stroke-width="1.5"/>
    <line x1="340" y1="230" x2="400" y2="290" stroke="#1565C0" stroke-width="1.5"/>
    <!-- Worker Agents -->
    <rect x="90" y="295" width="110" height="50" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
    <text x="145" y="318" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E88E5">销售 Agent</text>
    <text x="145" y="334" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="10" fill="#6B7280">自主执行</text>
    <rect x="215" y="295" width="110" height="50" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
    <text x="270" y="318" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E88E5">客服 Agent</text>
    <text x="270" y="334" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="10" fill="#6B7280">自主执行</text>
    <rect x="340" y="295" width="110" height="50" rx="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="1.5"/>
    <text x="395" y="318" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E88E5">财务 Agent</text>
    <text x="395" y="334" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="10" fill="#6B7280">自主执行</text>
    <!-- Arrows to humans -->
    <line x1="145" y1="345" x2="145" y2="390" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="270" y1="345" x2="270" y2="390" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="395" y1="345" x2="395" y2="390" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- Humans -->
    <rect x="100" y="395" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <use data-icon="tabler-outline/users" x="110" y="403" width="22" height="22" fill="#6B7280" stroke-width="2"/>
    <text x="136" y="420" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#6B7280">员工A</text>
    <rect x="225" y="395" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <use data-icon="tabler-outline/users" x="235" y="403" width="22" height="22" fill="#6B7280" stroke-width="2"/>
    <text x="261" y="420" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#6B7280">员工B</text>
    <rect x="350" y="395" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <use data-icon="tabler-outline/users" x="360" y="403" width="22" height="22" fill="#6B7280" stroke-width="2"/>
    <text x="386" y="420" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#6B7280">员工C</text>
    <!-- Escalation label -->
    <text x="270" y="470" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#FF6F00">↑ 升级到人工处理/确认</text>
    <!-- Feedback arrow -->
    <path d="M 420 320 Q 460 320 460 230 Q 460 200 420 200" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="465" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="10" fill="#2E7D32">反馈结果</text>
  </g>
  <!-- Right: Core questions -->
  <g id="questions">
    <text x="520" y="160" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="18" font-weight="700" fill="#1D1D1F">三个核心问题</text>
    <line x1="520" y1="175" x2="700" y2="175" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Q1 -->
    <rect x="520" y="195" width="680" height="100" rx="8" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="520" y="195" width="4" height="100" rx="2" fill="#1565C0"/>
    <use data-icon="tabler-outline/network" x="545" y="220" width="32" height="32" fill="#1565C0" stroke-width="2"/>
    <text x="595" y="230" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D1D1F">架构全流程是什么样的？</text>
    <text x="595" y="255" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7280">中台Agent的完整生命周期：从事件感知到结果闭环</text>
    <text x="595" y="278" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7280">包含哪些核心组件和层次？</text>
    <!-- Q2 -->
    <rect x="520" y="310" width="680" height="100" rx="8" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="520" y="310" width="4" height="100" rx="2" fill="#FF6F00"/>
    <use data-icon="tabler-outline/bolt" x="545" y="335" width="32" height="32" fill="#FF6F00" stroke-width="2"/>
    <text x="595" y="345" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D1D1F">如何下发任务？</text>
    <text x="595" y="370" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7280">任务拆解、路由决策、结构化载荷、并行/串行策略</text>
    <text x="595" y="393" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7280">状态跟踪与 SLA 管理</text>
    <!-- Q3 -->
    <rect x="520" y="425" width="680" height="100" rx="8" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="520" y="425" width="4" height="100" rx="2" fill="#1E88E5"/>
    <use data-icon="tabler-outline/message-2" x="545" y="450" width="32" height="32" fill="#1E88E5" stroke-width="2"/>
    <text x="595" y="460" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D1D1F">如何与不同Agent交互？</text>
    <text x="595" y="485" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7280">异构Agent的通信协议、能力发现、上下文传递</text>
    <text x="595" y="508" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7280">人机协同升级与状态恢复机制</text>
  </g>
  <!-- Research sources note -->
  <text x="520" y="580" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9CA3AF">研究来源：ChatGPT / Claude / Grok / Gemini 四家 LLM 深度分析报告</text>
  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#9CA3AF">02</text>
</svg>