<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <!-- Title -->
  <text x="640" y="52" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="30" fill="#1D1D1F" text-anchor="middle" font-weight="bold">Orchestrator 核心组件</text>
  <!-- Center hub -->
  <circle cx="640" cy="380" r="70" fill="#1565C0" fill-opacity="0.08" stroke="#1565C0" stroke-width="2"/>
  <circle cx="640" cy="380" r="50" fill="#1565C0" fill-opacity="0.15" stroke="#1565C0" stroke-width="1.5"/>
  <text x="640" y="373" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#1565C0" text-anchor="middle" font-weight="bold">Orchestrator</text>
  <text x="640" y="393" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#1565C0" text-anchor="middle">Agent</text>
  <!-- Outer ring (dashed) -->
  <circle cx="640" cy="380" r="220" fill="none" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="8,6"/>
  <!-- Spoke A: Task Planner (top) -->
  <line x1="640" y1="310" x2="640" y2="185" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="640" cy="155" r="40" fill="#F5F7FA" stroke="#1565C0" stroke-width="1.5"/>
  <text x="640" y="148" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1565C0" text-anchor="middle" font-weight="bold">A</text>
  <text x="640" y="168" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1D1D1F" text-anchor="middle">Task Planner</text>
  <text x="640" y="210" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">任务规划</text>
  <!-- Spoke B: Workflow State Machine (top-right) -->
  <line x1="700" y1="330" x2="830" y2="240" stroke="#FF6F00" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="860" cy="220" r="40" fill="#F5F7FA" stroke="#FF6F00" stroke-width="1.5"/>
