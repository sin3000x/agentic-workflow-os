  <text x="860" y="553" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1D1D1F" text-anchor="middle">Agent Registry</text>
  <text x="860" y="595" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">注册中心</text>
  <!-- Spoke D: Policy Engine (bottom-left) -->
  <line x1="580" y1="420" x2="450" y2="510" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="420" cy="540" r="40" fill="#F5F7FA" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="420" y="533" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2E7D32" text-anchor="middle" font-weight="bold">D</text>
  <text x="420" y="553" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1D1D1F" text-anchor="middle">Policy Engine</text>
  <text x="420" y="595" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">策略层</text>
  <!-- Spoke E: Human Escalation (top-left) -->
  <line x1="580" y1="330" x2="450" y2="240" stroke="#C62828" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="420" cy="220" r="40" fill="#F5F7FA" stroke="#C62828" stroke-width="1.5"/>
  <text x="420" y="213" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C62828" text-anchor="middle" font-weight="bold">E</text>
  <text x="420" y="233" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1D1D1F" text-anchor="middle">Escalation</text>
  <text x="420" y="275" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">人工升级</text>
  <!-- Subtitle -->
  <text x="640" y="670" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">Hub-and-Spoke 中心辐射模式：所有通信经由 Orchestrator 协调</text>
  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#9CA3AF">06</text>
