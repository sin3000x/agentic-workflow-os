  <text x="860" y="233" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1D1D1F" text-anchor="middle">State Machine</text>
  <text x="860" y="275" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">工作流状态机</text>
  <!-- Spoke C: Agent Registry (bottom-right) -->
  <line x1="700" y1="420" x2="830" y2="510" stroke="#1E88E5" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="860" cy="540" r="40" fill="#F5F7FA" stroke="#1E88E5" stroke-width="1.5"/>
