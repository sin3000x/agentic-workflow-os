<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <!-- Title -->
  <text x="640" y="52" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="30" fill="#1D1D1F" text-anchor="middle" font-weight="bold">Saga 事务模式 — 保障多Agent数据一致性</text>
  <!-- Phase labels -->
  <text x="80" y="100" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#1565C0" font-weight="bold">三阶段事务模型</text>
  <!-- Phase 1 -->
  <rect x="80" y="120" width="360" height="200" rx="8" fill="#F5F7FA" stroke="#1565C0" stroke-width="1.5"/>
  <rect x="80" y="120" width="360" height="40" rx="8" fill="#1565C0"/>
  <rect x="80" y="145" width="360" height="15" fill="#1565C0"/>
  <text x="100" y="147" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold">1. 可补偿交易 (Compensable)</text>
  <text x="100" y="190" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#1D1D1F">员工 Agent 执行业务操作</text>
  <text x="100" y="220" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 每步注册对应的补偿动作</text>
  <text x="100" y="248" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 失败时可回滚到初始状态</text>
  <text x="100" y="276" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 例：预留库存、冻结资金</text>
  <text x="100" y="305" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1565C0">补偿 = 逆向操作（释放库存、解冻资金）</text>
  <!-- Arrow 1->2 -->
  <line x1="440" y1="220" x2="470" y2="220" stroke="#FF6F00" stroke-width="2"/>
  <polygon points="470,215 480,220 470,225" fill="#FF6F00"/>
  <!-- Phase 2 -->
  <rect x="480" y="120" width="320" height="200" rx="8" fill="#F5F7FA" stroke="#FF6F00" stroke-width="1.5"/>
  <rect x="480" y="120" width="320" height="40" rx="8" fill="#FF6F00"/>
  <rect x="480" y="145" width="320" height="15" fill="#FF6F00"/>
  <text x="500" y="147" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold">2. 枢轴交易 (Pivot)</text>
  <text x="500" y="190" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#1D1D1F">人类确认 = 不归路点</text>
  <text x="500" y="220" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• Point of No Return</text>
  <text x="500" y="248" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 批准后不可撤销</text>
  <text x="500" y="276" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 拒绝则触发全链补偿</text>
  <rect x="500" y="290" width="280" height="22" rx="4" fill="#C62828" fill-opacity="0.1"/>
  <text x="640" y="306" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C62828" text-anchor="middle">Human Approval = Saga Pivot Point</text>
  <!-- Arrow 2->3 -->
  <line x1="800" y1="220" x2="830" y2="220" stroke="#2E7D32" stroke-width="2"/>
  <polygon points="830,215 840,220 830,225" fill="#2E7D32"/>
  <!-- Phase 3 -->
  <rect x="840" y="120" width="360" height="200" rx="8" fill="#F5F7FA" stroke="#2E7D32" stroke-width="1.5"/>
  <rect x="840" y="120" width="360" height="40" rx="8" fill="#2E7D32"/>
  <rect x="840" y="145" width="360" height="15" fill="#2E7D32"/>
  <text x="860" y="147" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold">3. 可重试交易 (Retryable)</text>
  <text x="860" y="190" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#1D1D1F">幂等重试直到成功</text>
  <text x="860" y="220" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 批准后的后续操作</text>
  <text x="860" y="248" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 保证最终一致性</text>
  <text x="860" y="276" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7280">• 例：实际扣款、发货通知</text>
  <text x="860" y="305" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2E7D32">幂等 = 重复执行结果不变</text>
  <!-- Divider -->
  <line x1="80" y1="360" x2="1200" y2="360" stroke="#E5E7EB" stroke-width="1"/>
  <!-- Example flow -->
  <text x="80" y="395" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#1565C0" font-weight="bold">示例：采购审批 Saga 流程</text>
  <!-- Flow boxes -->
  <rect x="80" y="420" width="200" height="65" rx="8" fill="#1565C0" fill-opacity="0.08" stroke="#1565C0" stroke-width="1.5"/>
  <text x="180" y="448" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#1565C0" text-anchor="middle" font-weight="bold">库存 Agent</text>
  <text x="180" y="470" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2E7D32" text-anchor="middle">预留库存 (成功)</text>
  <line x1="280" y1="452" x2="320" y2="452" stroke="#6B7280" stroke-width="1.5"/>
  <polygon points="320,448 328,452 320,456" fill="#6B7280"/>
  <rect x="330" y="420" width="200" height="65" rx="8" fill="#1565C0" fill-opacity="0.08" stroke="#1565C0" stroke-width="1.5"/>
  <text x="430" y="448" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#1565C0" text-anchor="middle" font-weight="bold">财务 Agent</text>
  <text x="430" y="470" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2E7D32" text-anchor="middle">冻结资金 (成功)</text>
  <line x1="530" y1="452" x2="570" y2="452" stroke="#6B7280" stroke-width="1.5"/>
  <polygon points="570,448 578,452 570,456" fill="#6B7280"/>
  <rect x="580" y="420" width="200" height="65" rx="8" fill="#FF6F00" fill-opacity="0.08" stroke="#FF6F00" stroke-width="1.5"/>
  <text x="680" y="448" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#FF6F00" text-anchor="middle" font-weight="bold">人工批准 (Pivot)</text>
  <text x="680" y="470" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C62828" text-anchor="middle">拒绝 → 触发补偿</text>
  <!-- Compensation arrows -->
  <line x1="580" y1="490" x2="580" y2="530" stroke="#C62828" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="580" y1="530" x2="80" y2="530" stroke="#C62828" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="85,526 80,530 85,534" fill="#C62828"/>
  <text x="330" y="550" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#C62828" text-anchor="middle">补偿回滚：释放库存 + 解冻资金</text>
  <!-- Success path -->
  <line x1="780" y1="452" x2="820" y2="452" stroke="#2E7D32" stroke-width="1.5"/>
  <polygon points="820,448 828,452 820,456" fill="#2E7D32"/>
  <rect x="830" y="420" width="200" height="65" rx="8" fill="#2E7D32" fill-opacity="0.08" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="930" y="448" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="bold">批准 → 扣款发货</text>
  <text x="930" y="470" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2E7D32" text-anchor="middle">幂等重试直到完成</text>
  <!-- Bottom note -->
  <rect x="300" y="590" width="680" height="50" rx="8" fill="#1565C0" fill-opacity="0.05" stroke="#1565C0" stroke-width="1"/>
  <text x="640" y="620" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#1565C0" text-anchor="middle">Saga 模式天然适配 Agent Teamwork：每个 Agent 步骤 = 一个 Saga 参与者</text>
  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#9CA3AF">09</text>
</svg>