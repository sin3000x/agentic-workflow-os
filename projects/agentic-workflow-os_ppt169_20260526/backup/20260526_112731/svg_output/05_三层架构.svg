<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <!-- Title -->
  <text x="640" y="52" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="30" fill="#1D1D1F" text-anchor="middle" font-weight="bold">企业级 Agent Teamwork 三层架构</text>
  <!-- Layer 1: Event & Signal Layer -->
  <rect x="160" y="90" width="60" height="170" rx="4" fill="#1565C0"/>
  <text x="190" y="165" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">01</text>
  <rect x="230" y="90" width="890" height="170" rx="8" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="260" y="125" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#1565C0" font-weight="bold">Event &amp; Signal Layer — 事件与信号层</text>
  <text x="260" y="158" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#1D1D1F">核心能力：数据分析 / KPI 监控 / 异常检测 / 风险识别</text>
  <text x="260" y="190" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#6B7280">数据源：ERP / CRM / BI / Logs</text>
  <!-- Source boxes -->
  <rect x="280" y="210" width="80" height="32" rx="4" fill="#1565C0" fill-opacity="0.1" stroke="#1565C0" stroke-width="1"/>
  <text x="320" y="231" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#1565C0" text-anchor="middle">ERP</text>
  <rect x="380" y="210" width="80" height="32" rx="4" fill="#1565C0" fill-opacity="0.1" stroke="#1565C0" stroke-width="1"/>
  <text x="420" y="231" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#1565C0" text-anchor="middle">CRM</text>
  <rect x="480" y="210" width="80" height="32" rx="4" fill="#1565C0" fill-opacity="0.1" stroke="#1565C0" stroke-width="1"/>
  <text x="520" y="231" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#1565C0" text-anchor="middle">BI</text>
  <rect x="580" y="210" width="80" height="32" rx="4" fill="#1565C0" fill-opacity="0.1" stroke="#1565C0" stroke-width="1"/>
  <text x="620" y="231" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#1565C0" text-anchor="middle">Logs</text>
  <!-- Arrow down 1 -->
  <polygon points="640,270 630,270 640,290 650,270" fill="#FF6F00"/>
  <rect x="637" y="260" width="6" height="12" fill="#FF6F00"/>
  <!-- Layer 2: Orchestrator -->
  <rect x="160" y="300" width="60" height="170" rx="4" fill="#FF6F00"/>
  <text x="190" y="375" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">02</text>
  <rect x="230" y="300" width="890" height="170" rx="8" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="260" y="335" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#FF6F00" font-weight="bold">Orchestrator / Supervisor — 编排与监督层</text>
  <text x="260" y="368" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#1D1D1F">任务规划 / 策略引擎 / 工作流运行时 / SLA 跟踪 / 升级机制</text>
  <rect x="280" y="390" width="120" height="32" rx="4" fill="#FF6F00" fill-opacity="0.1" stroke="#FF6F00" stroke-width="1"/>
  <text x="340" y="411" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#FF6F00" text-anchor="middle">Task Planner</text>
  <rect x="420" y="390" width="120" height="32" rx="4" fill="#FF6F00" fill-opacity="0.1" stroke="#FF6F00" stroke-width="1"/>
  <text x="480" y="411" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#FF6F00" text-anchor="middle">Policy Engine</text>
  <rect x="560" y="390" width="140" height="32" rx="4" fill="#FF6F00" fill-opacity="0.1" stroke="#FF6F00" stroke-width="1"/>
  <text x="630" y="411" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#FF6F00" text-anchor="middle">Workflow Runtime</text>
  <rect x="720" y="390" width="120" height="32" rx="4" fill="#FF6F00" fill-opacity="0.1" stroke="#FF6F00" stroke-width="1"/>
  <text x="780" y="411" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#FF6F00" text-anchor="middle">SLA Tracker</text>
  <rect x="860" y="390" width="120" height="32" rx="4" fill="#FF6F00" fill-opacity="0.1" stroke="#FF6F00" stroke-width="1"/>
  <text x="920" y="411" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#FF6F00" text-anchor="middle">Escalation</text>
  <!-- Arrow down 2 -->
  <polygon points="640,480 630,480 640,500 650,480" fill="#2E7D32"/>
  <rect x="637" y="470" width="6" height="12" fill="#2E7D32"/>
  <!-- Layer 3: Worker Agents -->
  <rect x="160" y="510" width="60" height="170" rx="4" fill="#2E7D32"/>
  <text x="190" y="585" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="bold">03</text>
  <rect x="230" y="510" width="890" height="170" rx="8" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="260" y="545" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#2E7D32" font-weight="bold">Worker Agents + Humans — 执行层</text>
  <text x="260" y="578" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#1D1D1F">专业 Agent 执行具体任务，关键节点由人类审批确认</text>
  <!-- Agent boxes -->
  <rect x="280" y="600" width="130" height="40" rx="6" fill="#2E7D32" fill-opacity="0.12" stroke="#2E7D32" stroke-width="1"/>
  <text x="345" y="625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2E7D32" text-anchor="middle">Sales Agent</text>
  <rect x="430" y="600" width="140" height="40" rx="6" fill="#2E7D32" fill-opacity="0.12" stroke="#2E7D32" stroke-width="1"/>
  <text x="500" y="625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2E7D32" text-anchor="middle">Support Agent</text>
  <rect x="590" y="600" width="140" height="40" rx="6" fill="#2E7D32" fill-opacity="0.12" stroke="#2E7D32" stroke-width="1"/>
  <text x="660" y="625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2E7D32" text-anchor="middle">Finance Agent</text>
  <text x="760" y="625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#6B7280">→</text>
  <rect x="790" y="600" width="120" height="40" rx="6" fill="#1565C0" fill-opacity="0.12" stroke="#1565C0" stroke-width="1"/>
  <text x="850" y="625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#1565C0" text-anchor="middle">Human 审批</text>
  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#9CA3AF">05</text>
</svg>