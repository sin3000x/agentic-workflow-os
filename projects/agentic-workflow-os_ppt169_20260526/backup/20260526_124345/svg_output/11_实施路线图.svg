<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <!-- Title -->
  <text x="640" y="52" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="30" fill="#1D1D1F" text-anchor="middle" font-weight="bold">三阶段演进路径</text>
  <!-- Horizontal timeline line -->
  <line x1="140" y1="160" x2="1140" y2="160" stroke="#E5E7EB" stroke-width="3"/>
  <!-- Phase 1 -->
  <circle cx="280" cy="160" r="28" fill="#1565C0" stroke="#FFFFFF" stroke-width="3"/>
  <text x="280" y="167" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <text x="280" y="210" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#1565C0" text-anchor="middle" font-weight="bold">Phase 1</text>
  <text x="280" y="235" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">核心基础</text>
  <rect x="130" y="260" width="300" height="280" rx="10" fill="#F5F7FA" stroke="#1565C0" stroke-width="1.5"/>
  <rect x="155" y="290" width="250" height="44" rx="6" fill="#1565C0" fill-opacity="0.08" stroke="#1565C0" stroke-width="1"/>
  <text x="280" y="317" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#1565C0" text-anchor="middle">Workflow State Machine</text>
  <rect x="155" y="348" width="250" height="44" rx="6" fill="#1565C0" fill-opacity="0.08" stroke="#1565C0" stroke-width="1"/>
  <text x="280" y="375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#1565C0" text-anchor="middle">Human Escalation</text>
  <rect x="155" y="406" width="250" height="44" rx="6" fill="#1565C0" fill-opacity="0.08" stroke="#1565C0" stroke-width="1"/>
  <text x="280" y="433" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#1565C0" text-anchor="middle">Audit &amp; Replay</text>
  <rect x="155" y="464" width="250" height="44" rx="6" fill="#1565C0" fill-opacity="0.08" stroke="#1565C0" stroke-width="1"/>
  <text x="280" y="491" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#1565C0" text-anchor="middle">Agent Registry</text>
  <!-- Phase 2 -->
  <circle cx="640" cy="160" r="28" fill="#FF6F00" stroke="#FFFFFF" stroke-width="3"/>
  <text x="640" y="167" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
  <text x="640" y="210" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#FF6F00" text-anchor="middle" font-weight="bold">Phase 2</text>
  <text x="640" y="235" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">治理增强</text>
  <rect x="490" y="260" width="300" height="280" rx="10" fill="#F5F7FA" stroke="#FF6F00" stroke-width="1.5"/>
  <rect x="515" y="290" width="250" height="44" rx="6" fill="#FF6F00" fill-opacity="0.08" stroke="#FF6F00" stroke-width="1"/>
  <text x="640" y="317" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#FF6F00" text-anchor="middle">Policy Engine</text>
  <rect x="515" y="348" width="250" height="44" rx="6" fill="#FF6F00" fill-opacity="0.08" stroke="#FF6F00" stroke-width="1"/>
  <text x="640" y="375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#FF6F00" text-anchor="middle">Memory &amp; Experience Layer</text>
  <text x="640" y="440" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">策略驱动的自动化治理</text>
  <text x="640" y="468" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">Agent 经验积累与复用</text>
  <!-- Phase 3 -->
  <circle cx="1000" cy="160" r="28" fill="#2E7D32" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1000" y="167" font-family="Georgia, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <text x="1000" y="210" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#2E7D32" text-anchor="middle" font-weight="bold">Phase 3</text>
  <text x="1000" y="235" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">协议互联</text>
  <rect x="850" y="260" width="300" height="280" rx="10" fill="#F5F7FA" stroke="#2E7D32" stroke-width="1.5"/>
  <rect x="875" y="290" width="250" height="44" rx="6" fill="#2E7D32" fill-opacity="0.08" stroke="#2E7D32" stroke-width="1"/>
  <text x="1000" y="317" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#2E7D32" text-anchor="middle">Agent-to-Agent Protocol</text>
  <text x="1000" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">跨平台 Agent 互联</text>
  <text x="1000" y="408" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">动态能力发现与协商</text>
  <text x="1000" y="436" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">混合通信模式</text>
  <!-- Bottom principle -->
  <rect x="300" y="590" width="680" height="60" rx="10" fill="#1565C0" fill-opacity="0.05" stroke="#1565C0" stroke-width="1.5"/>
  <text x="640" y="618" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#1565C0" text-anchor="middle" font-weight="bold">原则：从中心化开始，逐步引入混合通信</text>
  <text x="640" y="640" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">先跑通核心流程，再扩展治理能力，最后开放协议互联</text>
  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#9CA3AF">11</text>
</svg>